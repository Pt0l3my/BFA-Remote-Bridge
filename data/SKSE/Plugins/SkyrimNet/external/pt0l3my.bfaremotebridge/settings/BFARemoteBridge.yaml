# BFA Remote Bridge's page on SkyrimNet's plugin settings. SkyrimNet keeps the player's values in
# config/plugins/BFARemoteBridge/settings.yaml, which is never shipped. The file's name is the config's name,
# BFARemoteBridge (Plugin_BFARemoteBridge). The DLL reads every key with
# PublicGetPluginConfigValue("BFARemoteBridge", key, default), at the data-loaded message, at each game load and
# whenever the page is saved. Keys are flat. Every default, type and range here must equal the DLL's
# (SettingKeys() in src/core/Settings.cpp); tests/CoreTests.cpp checks them both ways.
#
# The page holds only what the server can't tell the bridge. The hardware the model runs on is chosen in PandorumLLM.
# Keys of 1.1 (enabled, accessKey, timeoutMs, checkCalls) are gone; their saved values are ignored.

plugin:
  name: "BFARemoteBridge"
  version: "1.4.0"
  description: "Sends Better Facial Animations' lip-sync model runs to PandorumLLM's A2F server on another PC of your network, and shows what the server does."

schema:
  fields:
    # Server
    - name: "Server address"
      path: "serverAddress"
      type: "string"
      description: "The address of the PC running PandorumLLM's A2F server, on your local network. Leave it empty and the bridge finds the server by itself, once its Remote IP is set to this PC: that needs a PandorumLLM that speaks the bridge's protocol version 2, a release after v3.97 Beta patch7. For an older PandorumLLM, enter the address."
      defaultValue: ""
      category: "Server"
    - name: "Port"
      path: "serverPort"
      type: "int"
      description: "The A2F server's port, as set in PandorumLLM: used with the address above, and for finding the server when the address is empty."
      defaultValue: 7871
      min: 1
      max: 65535
      category: "Server"

    # Lip sync
    - name: "Lip sync in scenes"
      path: "sceneLipSync"
      type: "bool"
      description: "Better Facial Animations otherwise leaves the faces of everyone in an OStim or SexLab scene to the scene. With this on, speakers in a scene get BFA's lip sync and expression for their lines. Takes effect at once."
      defaultValue: true
      category: "Lip sync"

    # Monitor
    - name: "Status on load"
      path: "showStatus"
      type: "bool"
      description: "Shows on screen, at each game load and when a model is served, which card and server run each of BFA's models. Notes about lines getting the game's own lip sync show either way."
      defaultValue: true
      category: "Monitor"
    - name: "Log detail"
      path: "logDetail"
      type: "select"
      description: "Detailed also logs every call's round trip, each connection opened or closed and why, each answer to HELLO, each unanswered PING, each reconnection attempt, and a line kept in a scene at most once a minute."
      defaultValue: "Normal"
      options:
        - Normal
        - Detailed
      category: "Monitor"
